<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Flujo de pago de Turno Libre">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#CBD5E1"/>
    </marker>
  </defs>

  <rect width="1200" height="320" rx="24" fill="#F8FAFC"/>
  <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#E2E8F0"/>

  <text x="48" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#64748B">FLUJO DE PAGO</text>
  <text x="48" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">De la intención de reserva al turno confirmado</text>

  <g fill="none" stroke="#CBD5E1" stroke-width="2">
    <line x1="174" y1="130" x2="322" y2="130" marker-end="url(#arrow)"/>
    <line x1="394" y1="130" x2="542" y2="130" marker-end="url(#arrow)"/>
    <line x1="614" y1="130" x2="762" y2="130" marker-end="url(#arrow)"/>
    <line x1="834" y1="130" x2="982" y2="130" marker-end="url(#arrow)"/>
  </g>

  <circle cx="140" cy="130" r="34" fill="#EE5801" filter="url(#shadow)"/>
  <text x="140" y="137" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">1</text>

  <circle cx="360" cy="130" r="34" fill="#0F172A" filter="url(#shadow)"/>
  <text x="360" y="137" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">2</text>

  <circle cx="580" cy="130" r="34" fill="#F59E0B" filter="url(#shadow)"/>
  <text x="580" y="137" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">3</text>

  <circle cx="800" cy="130" r="34" fill="#10B981" filter="url(#shadow)"/>
  <text x="800" y="137" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">4</text>

  <circle cx="1020" cy="130" r="34" fill="#2563EB" filter="url(#shadow)"/>
  <text x="1020" y="137" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">5</text>

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="140" y="200" font-size="15" font-weight="700" fill="#0F172A">Cliente crea la orden</text>
    <text x="140" y="224" font-size="12" fill="#64748B">POST /pagos/crear-orden</text>

    <text x="360" y="200" font-size="15" font-weight="700" fill="#0F172A">Se bloquea la cancha</text>
    <text x="360" y="224" font-size="12" fill="#64748B">Turno pendiente de pago</text>

    <text x="580" y="200" font-size="15" font-weight="700" fill="#0F172A">Checkout Mercado Pago</text>
    <text x="580" y="224" font-size="12" fill="#64748B">Pago de la seña</text>

    <text x="800" y="200" font-size="15" font-weight="700" fill="#0F172A">Webhook firmado</text>
    <text x="800" y="224" font-size="12" fill="#64748B">HMAC SHA-256</text>

    <text x="1020" y="200" font-size="15" font-weight="700" fill="#0F172A">Turno confirmado</text>
    <text x="1020" y="224" font-size="12" fill="#64748B">Reservado + email</text>
  </g>

  <line x1="140" y1="272" x2="1020" y2="272" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="140" y="296" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748B">0 min</text>
  <text x="1020" y="296" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748B">10 min</text>

  <rect x="486" y="258" width="188" height="28" rx="14" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="580" y="277" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#C2410C">Sin pago, la cancha se libera</text>
</svg>
